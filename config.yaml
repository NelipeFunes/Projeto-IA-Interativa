# Configuração do assistente (Vision). Caminhos relativos são relativos à pasta do projeto.

assistente:
  nome: Vision              # no prompt, na janela e na bandeja; "Hey Vision" acorda (voz.ativacao)
  # Quando o Vision pede "sim" antes de agir (pedido de 01/10: só no que é sensível de verdade):
  #   sensiveis: luzes, criar/mudar evento, tarefa e memória vão direto; apagar evento, esquecer memória e
  #              lançar gasto perguntam. Guardar memória logo depois de ler reunião/convite/nota também pergunta.
  #   todas:     toda escrita pergunta (menos luzes, ver alexa.confirmar_luzes).
  #   nenhuma:   nada pergunta.
  confirmacao: sensiveis

usuario:
  nome: Felipe
  fuso: America/Sao_Paulo

modelo:
  nome: qwen3.5:4b          # troque para qwen3.5:9b depois de ver evals/resultado-4b-vs-9b.md
  pensar: false             # "thinking" do Qwen: deixa mais lento; desligado para voz
  contexto: 8192
  temperatura: 0.3
  manter_carregado: 30m     # quanto tempo o modelo fica na VRAM depois da última fala
  host: http://127.0.0.1:11434

memoria:
  modelo_embedding: embeddinggemma
  embedding_na_cpu: true    # não disputa VRAM com o modelo principal
  # Calibrado em 30/09 com embeddinggemma: fatos relevantes dão 0,24–0,49; irrelevantes ficam em ~0,19–0,29.
  # Injetar um fato a mais no prompt custa pouco; perder o fato certo custa caro. Por isso o limiar é baixo.
  top_k: 3
  similaridade_minima: 0.25
  similaridade_duplicata: 0.90  # "cachorra Luna" x "cadela Luna" = 0,98; fatos diferentes ≈ 0,60

conversa:
  turnos_no_historico: 6
  sessao_expira_min: 10

agenda:
  servidor: google-calendar
  calendarios_leitura:
    - primary
    - "pt-br.brazilian#holiday@group.v.calendar.google.com"
  calendario_escrita: primary
  duracao_padrao_min: 60
  aviso_login_dias: 6       # login do Google em modo teste vence em 7 dias
  # Cache: de ontem até daqui a 7 dias numa consulta só, refeita a cada 5 min e depois de cada mudança feita
  # pelo Vision. "O que tenho amanhã?" responde sem esperar o Google. Mais velho que cache_min, consulta direto.
  cache_dias: 7
  cache_min: 10

mcp:
  google-calendar:
    ativo: true
    comando: "%LOCALAPPDATA%\\Programs\\nodejs\\node.exe"
    args: ["node/node_modules/@cocal/google-calendar-mcp/build/index.js"]
    env:
      GOOGLE_OAUTH_CREDENTIALS: data/google-oauth.json
      ENABLED_TOOLS: list-events,search-events,get-event,create-event,update-event,delete-event
    timeout_s: 30
  orbit:
    ativo: false            # desligado em 30/09: Orbit suspenso no Render até virar o mês (01/10). Religue aqui.
    comando: ".venv\\Scripts\\python.exe"
    args: ["mcp_servers/orbit/server.py"]
    timeout_s: 100          # o Render leva ~1 min para acordar
  wispr:
    ativo: true             # reuniões, transcrições e notas do Wispr Flow (só leitura). Login: vision wispr-login
    tipo: wispr
    url: https://api.wisprflow.ai/connect/mcp
    oauth: data/wispr-oauth.json
    timeout_s: 30

pc:
  # Mexer no PC (pedido de 01/10): abrir/fechar programas, sites, volume, mídia, travar, desligar (pede "sim"),
  # timers e alarmes, e comando do PowerShell quando nada serve (SEMPRE pede "sim", mostrando o comando).
  ativo: true

clima:
  # Clima pela Open-Meteo (grátis, sem chave) e o "bom dia" (resumo: hora, clima, agenda de hoje, timers).
  # A cidade fica em data/config-local.yaml (clima.cidade: "Sua Cidade"), fora do git.
  ativo: true
  cidade: ""

web:
  # Busca na internet (pedido de 01/10). Com TAVILY_API_KEY no .env usa a Tavily (1.000 buscas grátis por mês,
  # já devolve um resumo); sem chave, ou com a cota no fim, usa o DuckDuckGo. Cache e contador em data/cache/.
  ativo: true
  resultados: 5
  cache_horas: 6            # a mesma busca dentro desse tempo não gasta crédito
  cota_mensal: 1000         # avisa com 90% gastos

spotify:
  # Música pelo Spotify (conta Premium). Login uma vez: `vision spotify-login --client-id SEU_ID` (o Client ID é
  # de um app seu em developer.spotify.com, com retorno http://127.0.0.1:8769/callback). Sem login, nada aparece.
  ativo: true

alexa:
  ativo: true               # luzes da Alexa pelo AlexaPy (não oficial). Login: vision alexa-login
  dominio: amazon.com.br
  # Só vale com assistente.confirmacao: todas. Aí as luzes ainda ligam direto, mas perguntam se ele acabou
  # de ler reunião, agenda ou nota (texto de terceiros). true aqui faz as luzes perguntarem sempre.
  confirmar_luzes: false

voz:
  microfone: [HyperX, C920]   # procura por nome, na ordem
  alto_falante: [HyperX]
  # xtts: voz natural na placa de vídeo (~2 GB, ~1 s por frase; no modo jogo sai da placa e fala o Piper).
  # piper: instantânea, na CPU, mais robótica. Sem o XTTS instalado ou sem o modelo, cai no Piper sozinho.
  # 02/10: o Felipe preferiu voltar ao Piper (a Tanja do XTTS não agradou). O XTTS continua disponível.
  motor: piper
  xtts_falante: Tanja Adelina # vozes de estúdio do XTTS-v2 (amostras de 01/10)
  piper_ate_caracteres: 45    # com o XTTS, resposta de uma frase só até esse tamanho sai pelo Piper, na hora (0 = nunca)
  voz_piper: pt_BR-faber-medium
  velocidade_fala: 1.0        # >1 fala mais devagar
  # Acabamento do Piper (02/10): pausa entre frases e variação da entonação/ritmo (vazio = padrão do modelo,
  # 0,667 e 0,8; menor = mais estável e "certinho", maior = mais solto). Amostras em amostras/piper-*.wav.
  pausa_entre_frases_s: 0.14
  piper_variacao:
  piper_variacao_ritmo:
  # parakeet-base-int8 (650 MB, carrega em 2,6 s) ou parakeet-ptbr (ajuste fino PT-BR, 2,5 GB, 4,3 s).
  # Com a sua voz (30/09) os dois transcreveram igual ("…quanto eu gastei com iFood esse mês?"), mas o
  # base carrega em 3,2 s contra 7,7 s e transcreve mais rápido. Fica o base.
  stt: parakeet-base-int8
  # Como ele acorda: "transcricao" = "Hey Vision" achado no texto do começo de cada fala curta (sem modelo pronto
  # para esse nome); "modelo" = openWakeWord com a palavra abaixo (o "Hey Jarvis" de antes).
  ativacao: transcricao
  palavra_ativacao: hey_jarvis
  # Inglês nativo dá 0,99; vozes sintéticas PT-BR dizendo "Hey Jarvis" deram 0,11–0,75; frases comuns ~0,00.
  # Sua voz (30/09, microfone da webcam, porque o HyperX estava mudo): 0,47 e 0,86. O limiar 0,3 pega as duas.
  # Recalibre com: vision teste voz
  limiar_ativacao: 0.3
  atalho: ctrl+alt+j
  # Conversa: "Hey Vision" abre; tudo o que você fala vai para ele até "Vision, standby"
  # ou esse tempo sem ninguém falar (pedido de 30/09: antes a janela de 8 s pegava conversa que não era com ele).
  conversa_silencio_max_s: 120
  confirmacao_prazo_s: 30     # "sim" por voz só vale até esse tempo depois do "Confirma?" (TV/fundo não confirma)
  saudacao: ""                # vazio: "Hey Vision" só dá um bipe e já ouve (pedido de 01/10); um texto aqui é falado
  despedida: ""               # "Vision, standby" só dá o bipe de desligar; um texto aqui é falado antes dele
  # Como o modo de voz do ChatGPT: se você falar enquanto ele fala, ele para na hora e ouve o que você disse.
  # Com caixa de som em vez de headset, a própria voz pode vazar no microfone: se cortar sozinho, ponha false.
  interromper_por_voz: true
  interromper_apos_s: 0.5     # quanto tempo de voz sua antes de cortar (tosse e estalo não cortam)
  silencio_fim_ms: 800        # quanto silêncio encerra a sua fala
  maximo_fala_s: 20

modo_jogo:
  ativo: true
  processos: [cs2.exe]
  checar_a_cada_s: 20

servidor:
  host: 127.0.0.1
  porta: 8765
  prazo_alexa_s: 6
