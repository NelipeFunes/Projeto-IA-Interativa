[project]
name = "jarvis"
version = "0.1.0"
description = "Assistente pessoal local do Felipe: agenda, finanças e memória, por texto e voz."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.6",
    "mcp>=1.20",
    "httpx>=0.28",
    "pyyaml>=6",
    "python-dotenv>=1",
    "numpy>=2",
    "tzdata",
    "psutil>=6",
    "uvicorn>=0.30",
    "starlette>=0.40",
    # voz
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "onnxruntime>=1.22",
    "onnx-asr[hub]>=0.7",
    "openwakeword>=0.6",
    "piper-tts>=1.3",
    "keyboard>=0.13",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.uv]
# O Jarvis só roda no Windows; sem isso o uv tenta resolver o tflite-runtime do Linux.
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ollama: precisa do Ollama rodando com os modelos baixados",
    "voz: precisa dos modelos de voz baixados",
]
