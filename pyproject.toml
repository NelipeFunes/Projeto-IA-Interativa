[project]
name = "vision"
version = "0.1.0"
description = "Assistente pessoal local do Felipe: agenda, finanças e memória, por texto e voz."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.6",
    "mcp>=2.2,<3",  # o Wispr Flow usa o cliente OAuth e o httpx2 do SDK 2.x
    "httpx>=0.28",
    "pyyaml>=6",
    "python-dotenv>=1",
    "numpy>=2",
    "tzdata",
    "psutil>=6",
    "uvicorn>=0.30",
    "starlette>=0.40",
    # voz
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "onnxruntime>=1.22",
    "onnx-asr[hub]>=0.7",
    "openwakeword>=0.6",
    "piper-tts>=1.3",
    "keyboard>=0.13",
    "pywebview>=6.2.1",
    "pystray>=0.19",
    "pillow>=11",
    "websockets>=13",
    "alexapy>=1.31,<2",
    "pycaw>=20240316",
    "ddgs>=9,<10",
    "wyoming>=1.5,<2",
]

[project.scripts]
vision = "vision.cli:main"

[project.gui-scripts]
# Sem janela de console: é o que o atalho da pasta Inicializar roda.
visionw = "vision.nucleo:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]
# Voz XTTS-v2 (voz.motor: xtts) na placa de vídeo. Sem este grupo, o Vision fala com o Piper.
# Licença do modelo: Coqui Public Model License (só uso não comercial).
xtts = [
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "coqui-tts>=0.27,<0.28",
    "transformers>=4.43,<5",  # o 5.x tirou o isin_mps_friendly que o XTTS importa
]

[tool.uv]
# O Vision só roda no Windows; sem isso o uv tenta resolver o tflite-runtime do Linux.
environments = ["sys_platform == 'win32'"]
default-groups = ["dev", "xtts"]

[[tool.uv.index]]
name = "pytorch-cu128"  # RTX 50xx (Blackwell) precisa do CUDA 12.8
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ollama: precisa do Ollama rodando com os modelos baixados",
    "voz: precisa dos modelos de voz baixados",
]
